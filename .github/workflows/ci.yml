
name: "Test and Scan"
on:
  push:
    branches: [main]


jobs:
  checkout:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}
    steps:
      - name: 'Test and Scan'
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "${{matrix.python-version}}"

      - name: Install tasks-api dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{matrix.service}}/requirements.txt
          pip install pytest

      - name: Run tasks-api tests
        run: python -m pytest services/${{matrix.service}} --junitxml=junit/test-results-${{matrix.service}}-${{matrix.python-version}}.xml
      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-test-report-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.service }}-${{ matrix.python-version }}.xml
          if-no-files-found: warn
        if: ${{ always() }}
