name: "Test and Scan"
on:
  push:
    branches: [main]


jobs:
  checkout:
    runs-on: ubuntu-latest

    steps:
      - name: 'Test and Scan'
        uses: actions/checkout@v7
     
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tasks-api dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/tasks-api/requirements.txt
          pip install pytest

      - name: Run tasks-api tests
        run: python -m pytest services/tasks-api
    